name: AutoGit core

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  native:
    name: native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: tests
        shell: bash
        run: go test ./...
      - name: deterministic Go release test floor
        shell: bash
        run: |
          set -o pipefail
          count="$(go test -count=1 -json ./... | awk '/"Action":"pass"/ && /"Test":/ {n++} END {print n+0}')"
          echo "deterministic Go test cases: ${count}"
          test "${count}" -ge 609
      - name: race tests
        if: matrix.race
        shell: bash
        run: go test -race ./...
      - name: vet
        shell: bash
        run: go vet ./...
      - name: build
        shell: bash
        run: go build ./...
      - name: performance benchmark sample
        shell: bash
        run: go test -run '^$' -bench '^Benchmark' -benchmem -benchtime=1s -count=5 ./...
      - name: p95 performance gates
        shell: bash
        run: bash scripts/performance-gate.sh

  cross-build:
    name: cross-build / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  reproducible-build:
    name: reproducible release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build supported binaries twice
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-build.sh --output dist/first
          bash scripts/release-build.sh --output dist/second
          for artifact in dist/first/*; do
            cmp "$artifact" "dist/second/$(basename "$artifact")"
          done

  security:
    name: security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: gosec
        shell: bash
        # These rules flag deliberate security boundaries: validated argv
        # execution, bounded path reads, restrictive chmod, Git's SHA-1
        # object format, and cleanup/diagnostic constants.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.8 -exclude=G101,G104,G204,G302,G304,G401,G505 ./...
      - name: secret scan
        shell: bash
        run: |
          if git grep -nI -E -e '-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- ':!.github/workflows/ci.yml' ':!internal/security/*'; then
            echo "credential-shaped content found in tracked source"
            exit 1
          fi
