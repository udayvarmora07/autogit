name: AutoGit core

on:
  push:
  pull_request:
  schedule:
    - cron: '17 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  native:
    name: native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: tests
        shell: bash
        run: bash scripts/test-suites.sh core
      - name: deterministic Go release test floor
        shell: bash
        run: |
          set -euo pipefail
          test_json="$RUNNER_TEMP/autogit-go-test.json"
          if ! go test -count=1 -json ./... >"$test_json" 2>&1; then
            echo "go test failure records:"
            failures="$(awk '/"Action":"fail"/ || /"Action":"output"/ && /FAIL/ {print}' "$test_json" | tail -n 80)"
            if [[ -n "$failures" ]]; then
              printf '%s\n' "$failures"
            else
              echo "no structured failure record was emitted"
            fi
            echo "go test JSON output (tail):"
            tail -n 200 "$test_json"
            exit 1
          fi
          count="$(awk '/"Action":"pass"/ && /"Test":/ {n++} END {print n+0}' "$test_json")"
          echo "deterministic Go test cases: ${count}"
          test "${count}" -ge 609
      - name: race tests
        if: matrix.race
        shell: bash
        run: go test -race ./...
      - name: built artifact smoke
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/autogit"
          go build -trimpath -o "$binary" ./cmd/autogit
          bash scripts/artifact-smoke.sh --binary "$binary"
      - name: client and repository scenario evaluation
        shell: bash
        run: |
          set -euo pipefail
          trace="$RUNNER_TEMP/autogit-scenario-${{ matrix.os }}.json"
          bash scripts/scenario-eval.sh --binary "$PWD/autogit" --trace "$trace"
      - name: retain scenario trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/autogit-scenario-${{ matrix.os }}.json
      - name: vet
        shell: bash
        run: go vet ./...
      - name: build
        shell: bash
        run: go build ./...
      - name: performance benchmark sample
        shell: bash
        run: go test -run '^$' -bench '^Benchmark' -benchmem -benchtime=1s -count=5 ./...
      - name: p95 performance gates
        shell: bash
        # Windows hosted runners show materially higher transient scheduler
        # tails. Keep the same strict budgets, but collect more independent
        # samples before failing the platform gate.
        env:
          AUTOGIT_PERF_RETRIES: ${{ matrix.os == 'windows-latest' && '4' || '2' }}
        run: AUTOGIT_PERF_OUTPUT=performance-results.tsv bash scripts/performance-gate.sh
      - name: retain performance budget artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-results-${{ matrix.os }}
          path: performance-results.tsv

  native-artifact:
    name: native artifact / ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux/amd64
          - os: ubuntu-24.04-arm
            target: linux/arm64
          - os: macos-15-intel
            target: darwin/amd64
          - os: macos-15
            target: darwin/arm64
          - os: windows-latest
            target: windows/amd64
          - os: windows-11-arm
            target: windows/arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows ARM hardened Git preflight
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          set -euo pipefail
          git --version
          preflight_root="$RUNNER_TEMP/autogit-git-preflight"
          mkdir -p "$preflight_root"
          GIT_CONFIG_NOSYSTEM=1 \
          GIT_CONFIG_GLOBAL='' \
          GIT_TERMINAL_PROMPT=0 \
          GIT_OPTIONAL_LOCKS=0 \
            git -c core.hooksPath= -c core.fsmonitor=false -c core.sshCommand= -c credential.helper= \
              init --initial-branch=main "$preflight_root"
      - name: native release artifact smoke
        shell: bash
        env:
          AUTOGIT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rm -rf dist
          bash scripts/release-build.sh --target "$AUTOGIT_TARGET" --output dist
          bash scripts/artifact-smoke.sh --directory dist
          binary="dist/autogit-${AUTOGIT_TARGET/\//-}"
          if [[ "$AUTOGIT_TARGET" == windows/* ]]; then
            binary+=".exe"
          fi
          trace="$RUNNER_TEMP/autogit-scenario-${AUTOGIT_TARGET//\//-}.json"
          bash scripts/scenario-eval.sh --binary "$binary" --trace "$trace"
      - name: retain native artifact scenario trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-artifact-scenario-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/autogit-scenario-*.json
      - name: native raw-binary install lifecycle drill
        shell: bash
        env:
          AUTOGIT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          previous_dir="$RUNNER_TEMP/autogit-install-previous"
          candidate_dir="$RUNNER_TEMP/autogit-install-candidate"
          mkdir -p "$previous_dir" "$candidate_dir"
          commit="$(git rev-parse HEAD)"
          AUTOGIT_VERSION=drill-previous AUTOGIT_COMMIT="$commit" \
            bash scripts/release-build.sh --target "$AUTOGIT_TARGET" --output "$previous_dir"
          AUTOGIT_VERSION=drill-candidate AUTOGIT_COMMIT="$commit" \
            bash scripts/release-build.sh --target "$AUTOGIT_TARGET" --output "$candidate_dir"
          binary="autogit-${AUTOGIT_TARGET/\//-}"
          if [[ "$AUTOGIT_TARGET" == windows/* ]]; then
            binary+=".exe"
          fi
          evidence="$RUNNER_TEMP/autogit-install-drill-${AUTOGIT_TARGET//\//-}.json"
          bash scripts/release-install-drill.sh \
            --previous "$previous_dir/$binary" \
            --candidate "$candidate_dir/$binary" \
            --output "$evidence"
          python3 -m json.tool "$evidence" >/dev/null
      - name: retain native install lifecycle evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-install-drill-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/autogit-install-drill-*.json

  presubmit:
    name: presubmit / bounded feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: presubmit suite
        shell: bash
        run: bash scripts/test-suites.sh presubmit

  soak:
    name: soak / ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: process-boundary soak suite
        shell: bash
        run: bash scripts/test-suites.sh soak

  fuzz:
    name: fuzz / bounded corpus
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz suite
        shell: bash
        env:
          AUTOGIT_FUZZ_TIME: 40s
        run: bash scripts/test-suites.sh fuzz

  cross-build:
    name: cross-build / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  reproducible-build:
    name: reproducible release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: release-build integration tests
        shell: bash
        run: go test -tags release_integration ./scripts -run '^TestReleaseBuild' -count=1
      - name: build supported binaries twice
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-build.sh --output dist/first
          bash scripts/release-build.sh --output dist/second
          for artifact in dist/first/*; do
            cmp "$artifact" "dist/second/$(basename "$artifact")"
          done
      - name: artifact smoke
        shell: bash
        run: bash scripts/artifact-smoke.sh --directory dist/first

  security:
    name: security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: shellcheck and shell safety checks
        shell: bash
        env:
          AUTOGIT_REQUIRE_SHELLCHECK: '1'
        run: bash scripts/check-shell.sh
      - name: staticcheck
        shell: bash
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: gosec
        shell: bash
        # Deliberate findings are suppressed at the exact validated boundary
        # with an owner-facing rationale; broad rule exclusions are forbidden.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - name: secret scan
        shell: bash
        run: |
          if git grep -nI -E -e '-----BEGIN (RSA|OPENSSH|EC|DSA|PGP) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- ':!.github/workflows/ci.yml' ':!internal/security/*'; then
            echo "credential-shaped content found in tracked source"
            exit 1
          fi

  dependency-policy:
    name: dependency and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: enforce dependency and workflow policy
        shell: bash
        run: bash scripts/check-dependencies.sh
