name: AutoGit core

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  native:
    name: native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: tests
        shell: bash
        run: go test ./...
      - name: race tests
        if: matrix.race
        shell: bash
        run: go test -race ./...
      - name: vet
        shell: bash
        run: go vet ./...
      - name: build
        shell: bash
        run: go build ./...

  cross-build:
    name: cross-build / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cross-build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...
