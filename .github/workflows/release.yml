name: AutoGit tagged release evidence

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: release quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: verify exact release tag and clean checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          test -z "$(git status --porcelain=v1)"
      - name: deterministic and race tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go test -race ./...
          go vet ./...
          go build ./...
      - name: release integration and artifact gates
        shell: bash
        run: bash scripts/test-suites.sh release
      - name: source vulnerability scan
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: shell and dependency policy checks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-shell.sh
          bash scripts/check-dependencies.sh

  reproducibility:
    name: reproducibility / ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-latest
          - label: macos
            os: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: verify exact release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          test -z "$(git status --porcelain=v1)"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: build independent release artifact set
        shell: bash
        env:
          AUTOGIT_VERSION: ${{ github.ref_name }}
          AUTOGIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test ! -e dist
          bash scripts/release-build.sh --output dist
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
      - name: retain independent artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autogit-${{ github.ref_name }}-repro-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          path: dist

  reproducibility_compare:
    name: compare independent release artifacts
    needs: reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: download Ubuntu artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autogit-${{ github.ref_name }}-repro-ubuntu
          path: ${{ runner.temp }}/autogit-repro/ubuntu
      - name: download macOS artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autogit-${{ github.ref_name }}-repro-macos
          path: ${{ runner.temp }}/autogit-repro/macos
      - name: compare every release artifact byte-for-byte
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ubuntu_dir="$RUNNER_TEMP/autogit-repro/ubuntu"
          macos_dir="$RUNNER_TEMP/autogit-repro/macos"
          test -f "$ubuntu_dir/SHA256SUMS"
          test -f "$macos_dir/SHA256SUMS"
          cmp "$ubuntu_dir/SHA256SUMS" "$macos_dir/SHA256SUMS"
          diff -u \
            <(cd "$ubuntu_dir" && sha256sum autogit-* | LC_ALL=C sort -k2,2) \
            <(cd "$macos_dir" && sha256sum autogit-* | LC_ALL=C sort -k2,2)
          while IFS= read -r name; do
            test -f "$macos_dir/$name"
            cmp "$ubuntu_dir/$name" "$macos_dir/$name"
          done < <(cd "$ubuntu_dir" && find . -maxdepth 1 -type f -name 'autogit-*' -printf '%f\n' | LC_ALL=C sort)
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$RELEASE_SHA"
            echo "runners=ubuntu-latest,macos-latest"
            echo "status=byte-identical"
            echo "sha256:"
            (cd "$ubuntu_dir" && sha256sum autogit-* | LC_ALL=C sort -k2,2)
          } > "$RUNNER_TEMP/autogit-reproducibility.txt"
      - name: retain reproducibility comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autogit-${{ github.ref_name }}-reproducibility
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/autogit-reproducibility.txt

  attest:
    name: build and attest release artifacts
    needs: [quality, reproducibility_compare]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: verify exact release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          test -z "$(git status --porcelain=v1)"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: build clean release directory
        shell: bash
        env:
          AUTOGIT_VERSION: ${{ github.ref_name }}
          AUTOGIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test ! -e dist
          bash scripts/release-build.sh --output dist
          bash scripts/artifact-smoke.sh --directory dist
          version_output="$(dist/autogit-linux-amd64 version)"
          grep -Eq '"version":"'"${AUTOGIT_VERSION}"'"' <<<"$version_output"
          grep -Eq '"commit":"'"${AUTOGIT_COMMIT}"'"' <<<"$version_output"
      - name: generate SPDX dependency SBOM
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          created="$(date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%dT%H:%M:%SZ')"
          go list -m -json all | go run ./cmd/autogit-sbom \
            --output dist/autogit.spdx.json \
            --name "autogit-${RELEASE_TAG}" \
            --namespace "https://github.com/udayvarmora07/autogit/sbom/${RELEASE_TAG}/${RELEASE_SHA}" \
            --root-module autogit \
            --version "$RELEASE_TAG" \
            --created "$created"
      - name: scan every release binary with govulncheck
        shell: bash
        run: |
          set -euo pipefail
          for binary in dist/autogit-*; do
            case "$binary" in
              *.exe) ;;
              *.json|*.txt) continue ;;
            esac
            report="dist/$(basename "$binary").govulncheck.txt"
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -mode=binary "$binary" >"$report" 2>&1
          done
      - name: create signed checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum autogit-* autogit.spdx.json | LC_ALL=C sort -k2,2 > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: attest SLSA provenance and checksums
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: attest SBOM
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/autogit.spdx.json
      - name: verify generated provenance as a consumer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-artifacts.sh \
            --directory dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_SHA"
      - name: upload release evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autogit-${{ github.ref_name }}-release-evidence
          if-no-files-found: error
          path: |
            dist
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.sbom.outputs.bundle-path }}
